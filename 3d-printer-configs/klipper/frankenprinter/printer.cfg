# Frankenprinter — Ender 3 V3 Neo / SKR Mini E3 V3.0
#
#   Board      BIGTREETECH SKR Mini E3 V3.0  (STM32G0B1)
#   Extruder   Creality Sprite (direct drive)
#   Probe      CR Touch          <- configured as [bltouch]; see note below
#   Z          dual motors, parallel on the single Z driver
#   Host       MainsailOS on Raspberry Pi
#
# Firmware built with: STM32G0B1 / 8KiB bootloader / 8MHz crystal /
#                      USB on PA11-PA12
#
# Every line marked "<<" needs a value measured or verified on the machine.
# See README.md for the commissioning order.

[include mainsail.cfg]
[exclude_object]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_25004F0015504D5930393520-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0


# ---------------------------------------------------------------------- X

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 235                # << verify actual travel; bed is 220
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999


# ---------------------------------------------------------------------- Y

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 235                # << verify actual travel
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999


# ---------------------------------------------------------------------- Z
# Both Z motors hang off the single Z driver via a splitter, so they share
# its current. 0.8 A is a safe starting point; watch the driver temperature
# after the first long print and back off to 0.70 if it runs hot.
# Do not exceed 1.0.

[stepper_z]
step_pin: PB0
dir_pin: PC5                     # << add ! if Z drives the wrong way
enable_pin: !PB1
microsteps: 16
rotation_distance: 8             # 4-start T8 leadscrew
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.800
stealthchop_threshold: 999999


# --------------------------------------------------------------- extruder
# Sprite: 424.9 steps/mm at 16 microsteps -> 3200 / 424.9 = 7.53
# Starting point only. Calibrate before trusting any flow number.

[extruder]
step_pin: PB3
dir_pin: !PB4                    # << drop the ! if it extrudes backwards
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.53          # << calibrate
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950        # << Sprite hotend; EPCOS 100K B57560G104F if
sensor_pin: PA0                  #    cold reading is off by more than ~2 C
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 260
max_extrude_only_distance: 150
pressure_advance: 0.0            # direct drive typically lands 0.03-0.06

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.600
stealthchop_threshold: 999999


# ------------------------------------------------------------------- heat

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 120

[fan]
pin: PC6                         # part cooling

[heater_fan heatbreak_cooling_fan]
pin: PC7
heater: extruder
heater_temp: 50.0


# -------------------------------------------------------------- CR Touch
# The section really is called [bltouch] — the CR Touch speaks the same
# protocol and Klipper has no separate section for it. The CR Touch-specific
# detail is the ^ pullup on sensor_pin; without it the open-collector output
# floats and the probe either never triggers or always reads triggered.

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -44.0                  # << MEASURE. probe position relative to nozzle
y_offset: -9.0                   # << MEASURE
z_offset: 1.0             # << low on purpose. Too small = nozzle prints high (safe).
                           #    Too large = nozzle crashes. PROBE_CALIBRATE will set the real value.
speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.01
samples_tolerance_retries: 3
stow_on_each_sample: False

[safe_z_home]
home_xy_position: 154, 119       # << bed centre minus the offsets above:
speed: 50                        #    110-(-44), 110-(-9)
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10, 10                 # << recompute from measured offsets:
mesh_max: 176, 211               #    220+x_offset, 220+y_offset
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[screws_tilt_adjust]             # << positions assume a 220x220 Ender bed
screw1: 74, 42
screw1_name: front left
screw2: 244, 42
screw2_name: front right
screw3: 244, 212
screw3_name: back right
screw4: 74, 212
screw4_name: back left
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4


# --------------------------------------------------------------- optional
# Fit these once the printer is otherwise working, not before.
#
# [filament_switch_sensor runout]
# switch_pin: ^PC15
#
# [neopixel board_rgb]
# pin: PA8
#
# [input_shaper]
# shaper_freq_x: 0
# shaper_freq_y: 0

[include shell_command.cfg]
